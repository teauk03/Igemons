services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-igemons}
      POSTGRES_USER: ${POSTGRES_USER:-igemons}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-igemons} -d ${POSTGRES_DB:-igemons}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
